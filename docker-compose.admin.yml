services:
  admin:
    build:
      context: .
      dockerfile: admin.Dockerfile
    image: sankore-admin:latest
    container_name: sankore-admin
    ports:
      # Variables distinctes de celles de `web` (ADMIN_PORT, ADMIN_ALLOWED_HOSTS) : le .env est
      # commun aux deux services, un nom partagé donnerait la même valeur aux deux — donc
      # un conflit de port sur l'hôte, et un seul domaine autorisé pour deux applications.
      - "${ADMIN_PORT:-4401}:4000"
    environment:
      # Obligatoire : sans elle le conteneur répond 400 sur toutes les routes (validation
      # de l'en-tête Host par Angular 22, cf. admin.Dockerfile). En déploiement, le ou les
      # domaines publics de l'admin, séparés par des virgules.
      NG_ALLOWED_HOSTS: "${ADMIN_ALLOWED_HOSTS:-localhost}"
      # Pas de NG_API_URL : apps/admin/src/server.ts n'expose pas `/config.json` et
      # l'application ne lit aucune URL d'API. Voir admin.Dockerfile pour ce qu'il faudra
      # ajouter le jour où l'admin appellera le back.
      #
      # Traefik termine TLS devant ce conteneur et lui parle en HTTP : sans ceci le rendu
      # SSR voit `http://` et l'hôte interne. À ne laisser actif QUE derrière un proxy de
      # confiance, ces en-têtes étant falsifiables par le client sinon.
      NG_TRUST_PROXY_HEADERS: "${NG_TRUST_PROXY_HEADERS:-}"
    restart: unless-stopped
    healthcheck:
      # Fichier statique, servi par express.static avant le handler Angular : la sonde ne
      # dépend donc pas de NG_ALLOWED_HOSTS et ne déclenche aucun rendu.
      test:
        - CMD
        - node
        - -e
        - "require('http').get({host:'127.0.0.1',port:process.env.PORT||4000,path:'/favicon.ico'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - sankore-internal

# Clé de premier niveau `networks` (au pluriel) : indentée sous `services`, elle était lue
# comme un service nommé « network » et Compose refusait tout le fichier. Déclarer le
# réseau ne suffit pas, il faut aussi l'attacher au service — sinon `web` reste sur le
# réseau `default` créé automatiquement.
networks:
  sankore-internal:
    driver: bridge