<div class="flex h-screen overflow-hidden">
  <common-portal-sidebar
    class="hidden lg:flex"
    [groups]="groups()"
    [activeId]="activeItem()?.id ?? null"
    [companyName]="companyName()"
    [logoUrl]="logoUrl()"
    [subtitle]="subtitle()"
  ></common-portal-sidebar>

  <!-- Petit écran : la même barre, en tiroir. -->
  @if (menuOpen()) {
    <div class="fixed inset-0 z-40 lg:hidden">
      <button type="button" class="absolute inset-0 bg-slate-900/40" aria-label="Fermer le menu" (click)="menuOpen.set(false)"></button>
      <common-portal-sidebar
        class="relative z-10 flex shadow-xl"
        [groups]="groups()"
        [activeId]="activeItem()?.id ?? null"
        [companyName]="companyName()"
        [logoUrl]="logoUrl()"
        [subtitle]="subtitle()"
        (navigated)="menuOpen.set(false)"
      ></common-portal-sidebar>
    </div>
  }

  <div class="flex min-w-0 flex-1 flex-col">
    <header class="flex h-[76px] shrink-0 items-center gap-3 border-b border-slate-200 bg-white px-4 lg:gap-4 lg:px-7">
      <button type="button" class="rounded-lg p-2 text-slate-600 hover:bg-slate-100 lg:hidden" aria-label="Ouvrir le menu" (click)="menuOpen.set(true)">
        <tas-icon iconName="feather:menu" style="font-size:20px"></tas-icon>
      </button>

      <div class="min-w-0 flex-1">
        @if (trail().length > 1) {
          <nav class="flex min-w-0 items-center gap-1 text-xs text-slate-500" aria-label="Fil d'Ariane">
            @for (crumb of trail(); track $index; let last = $last) {
              @if (crumb.link && !last) {
                <a [routerLink]="crumb.link" class="truncate hover:text-slate-800 hover:underline">{{ crumb.label }}</a>
              } @else {
                <span class="truncate">{{ crumb.label }}</span>
              }
              @if (!last) {
                <span aria-hidden="true">›</span>
              }
            }
          </nav>
        }
        <h1 class="truncate text-xl font-bold text-slate-900">{{ title() }}</h1>
      </div>

      <button
        type="button"
        class="hidden h-10 w-64 items-center gap-2 rounded-xl border border-slate-200 bg-white px-3 text-sm text-slate-500 transition hover:border-slate-300 md:flex"
        (click)="openPalette()"
      >
        <tas-icon iconName="feather:search" style="font-size:16px"></tas-icon>
        <span class="flex-1 text-left">Rechercher</span>
        <kbd class="rounded-md border border-slate-200 px-1.5 py-0.5 text-[11px] text-slate-500">{{ modifier }} K</kbd>
      </button>
      <button type="button" class="rounded-lg p-2 text-slate-600 hover:bg-slate-100 md:hidden" aria-label="Rechercher" (click)="openPalette()">
        <tas-icon iconName="feather:search" style="font-size:18px"></tas-icon>
      </button>

      <!-- Cloche des notifications in-app (WA-FE-10), pour tous les utilisateurs connectés. -->
      <common-notification-bell></common-notification-bell>

      <common-portal-user-menu (help)="openShortcuts()"></common-portal-user-menu>
    </header>

    <common-impersonation-banner></common-impersonation-banner>

    <main class="flex-1 overflow-y-auto p-4 lg:p-7">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
