<AuthenticationWrapper>
  <section>
    <TasTitle class="text-2xl">Mot de passe oublie</TasTitle>
    <p class="mt-6 text-xl text-slate-800 justify-center ">Entrer votre adresse electronique, vous allez recevoir un mail de reinitialisation qui sera valable pendant 24h.</p>
  </section>

  <section class="flex flex-col gap-6">
    <tas-form-field>
      <tas-label>Saisissez votre adresse électronique</tas-label>
      <input tasInput type="email" placeholder="Saisissez votre adresse électronique" [formField]="formSchema.email">
    </tas-form-field>
    <div class="mt-[50px] flex flex-col space-y-2 flex flex-col items-center space-y-5">
      <button class="w-full" tas-raised-button [color]="'primary'" [disabled]="formSchema().invalid()">Reinitialiser votre compte</button>
      <p>OU</p>
      <a class="text-center w-full" tas-outlined-button color="primary" [routerLink]="['/auth', 'login']">Se connecter</a>
    </div>
  </section>
</AuthenticationWrapper>
