<tas-form-field>
  <tas-label>
    <ng-content></ng-content>
  </tas-label>
    <input id="{{ id }}" tasInput [type]="passwordFieldType()" class="form-input" [value]="value()" (input)="value.set($event.target.value)" [placeholder]="placeholder()">
    <button tasSuffix type="button" (click)="showPassword.set(!showPassword())">
      <tas-icon [iconName]=" showPassword() ? 'feather:eye' : 'feather:eye-off'" iconSize="md"></tas-icon>
    </button>
</tas-form-field>
