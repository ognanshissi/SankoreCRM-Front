<!--
  Ce conteneur n'est pas interactif : il ne fait que barrer la propagation vers le
  listener `document:click` qui ferme la liste (cf. `_closeDropdownOnOutsideClick`).
  Sans lui, le clic sur le bouton d'ouverture refermerait la liste aussitôt.
-->
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
<div (click)="$event.stopPropagation()">
  <button
    class="relative block justify-between items-center py-2 px-2 text-left bg-transparent w-full"
    aria-haspopup="listbox"
    aria-expanded="true"
    type="button"
    (click)="toggleDropdown()"
    aria-labelledby="listbox-label"
  >
    <div [ngClass]="{'text-gray-400':!selectionModel.selected.length}">
      @if (selectionModel.selected.length) {
        @if (selectionModel.selected.length > 1) {
          <span class="bg-gray-200 rounded-full px-2 mr-1 inline-block">
            {{ selectionModel.selected[0][optionLabel()] }}
          </span>
          <!-- more selected-->
          <span class="bg-gray-200 rounded-full px-2 mr-1 inline-block">
            + {{ selectionModel.selected.length - 1 }} more</span
          >
        } @else {
          @for (selectedOption of selectionModel.selected; track selectedOption) {
            <span class="bg-gray-200 rounded-full px-2 mr-1 inline-block">
              {{ selectedOption[optionLabel()] }}
            </span>
          }
        }
      } @else {
        {{ placeholder() }}
      }
    </div>
    <span
      class="pointer-events-none absolute inset-y-0 right-0 ml-3 flex items-center pr-2"
    >
      @if (!isDropdownOpened()) {
        <!-- closed icon -->
        <svg
          class="h-5 w-5 text-gray-400"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M19.5 8.25l-7.5 7.5-7.5-7.5"
          />
        </svg>
      } @else {
        <!-- Open icon -->
        <svg
          class="h-5 w-5 text-gray-400"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M4.5 15.75l7.5-7.5 7.5 7.5"
          />
        </svg>
      }
    </span>
  </button>

  <!-- List dropdown -->
  @if (isDropdownOpened()) {
    <ul
      class="absolute z-20 mt-2 border border-gray-300 max-h-60 w-full overflow-auto rounded-md bg-white pb-1 text-base shadow-xl ring-1 ring-black ring-opacity-5 focus:outline-none sm:text-sm"
      tabindex="-1"
      role="listbox"
      aria-labelledby="listbox-label"
    >
      @if (searchable()) {
        <li class="px-2 pb-1 sticky top-0 bg-white z-10">
          <tas-form-field>
            <input
              type="search"
              [ngModel]="searchKey()"
              (input)="updateSearchKey($event)"
              tasInput
              class="form-input"
              placeholder="Rechercher..."
            />
          </tas-form-field>
        </li>
      }
      @for (item of filteredList(); track item[optionValue()]; let index = $index) {
        <li id="listbox-option-{{ index }}">
          <button
            type="button"
            class="relative w-full cursor-default hover:cursor-pointer hover:bg-gray-200 transition-all select-none py-4 pl-3 pr-9"
            [ngClass]="{'bg-gray-200 text-primary': selectionModel.isSelected(item) }"
            (click)="toggleSelection($any(item))"
          >
            @if (labelTemplate) {
              <ng-container
                *ngTemplateOutlet="labelTemplate; context: { $implicit: item }"
              ></ng-container>
            } @else {
              <div class="flex items-center">
                <span class="block truncate">{{ item[optionLabel()] }}</span>
              </div>
            }
          </button>
        </li>
      }
    </ul>
  }
</div>
