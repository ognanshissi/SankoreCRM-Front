# Application Angular en rendu serveur (SSR).
#
# L'image embarque le serveur Express généré par @angular/build et tourne sous Node :
# nginx ne conviendrait pas ici, il ne sait pas exécuter ce bundle.
#
#   docker compose up --build
#   http://localhost:4000

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: sankore-crm:latest
    container_name: sankore-crm
    ports:
      - "${WEB_PORT:-4000}:4000"
    environment:
      # Angular 22 valide l'en-tête Host des requêtes rendues côté serveur (protection
      # SSRF) et répond 400 pour tout hôte hors liste. Sans cette variable, le conteneur
      # ne sert rien. En déploiement, remplacer par le ou les domaines publics, séparés
      # par des virgules.
      NG_ALLOWED_HOSTS: "${NG_ALLOWED_HOSTS:-localhost}"
      # URL de l'API, relayée au navigateur par /config.json : le bundle client est
      # statique et ne lit pas process.env, c'est ce qui rend l'image réutilisable d'un
      # environnement à l'autre. `host.docker.internal` joint l'API qui tourne sur la
      # machine hôte ; en déploiement, le domaine public de l'API.
      NG_API_URL: "${NG_API_URL:-http://localhost:5080}"
      # Hôte public d'ingestion (webhooks remis aux fournisseurs). Vide → retombe sur
      # l'URL de l'API, ce qui est le comportement attendu en local.
      NG_INGEST_URL: "${NG_INGEST_URL:-}"
      # Traefik termine TLS devant ce conteneur et lui parle en HTTP : sans ceci le rendu
      # SSR voit `http://` et l'hôte interne, et construit des URL absolues fausses —
      # redirections vers http, liens canoniques erronés. Activé, @angular/ssr lit
      # `x-forwarded-proto` / `x-forwarded-host` posés par le proxy.
      #
      # À ne laisser actif QUE derrière un proxy de confiance : ces en-têtes sont
      # falsifiables par le client quand rien ne les réécrit en amont.
      NG_TRUST_PROXY_HEADERS: "${NG_TRUST_PROXY_HEADERS:-}"
    restart: unless-stopped
    healthcheck:
      # Sonde sur un fichier statique : express.static est monté avant le handler Angular,
      # donc la réponse ne dépend pas de NG_ALLOWED_HOSTS et ne déclenche pas un rendu SSR
      # complet à chaque intervalle.
      test:
        - CMD
        - node
        - -e
        - "require('http').get({host:'127.0.0.1',port:process.env.PORT||4000,path:'/favicon.ico'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - sankore-internal

# Clé de premier niveau `networks` (au pluriel) : indentée sous `services`, elle était lue
# comme un service nommé « network » et Compose refusait tout le fichier. Déclarer le
# réseau ne suffit pas, il faut aussi l'attacher au service — sinon `web` reste sur le
# réseau `default` créé automatiquement.
networks:
  sankore-internal:
    driver: bridge
