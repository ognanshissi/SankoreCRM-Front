name: Docker

# Construit les images `crm` et `admin` ici plutôt que sur le serveur Dokploy : le build de
# `crm` monte à ~3 Go de RAM même avec les réglages des Dockerfiles, et le serveur, qui fait
# tourner les conteneurs en service pendant le build, le tue sans message juste après
# « ❯ Building... ». Dokploy n'a plus qu'à tirer l'image publiée sur GHCR.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: crm
            dockerfile: Dockerfile
          - app: admin
            dockerfile: admin.Dockerfile
    steps:
      - uses: actions/checkout@v5

      # Actions tierces épinglées sur un SHA de commit et non sur un tag mobile : ce job a le droit
      # d'écrire sur GHCR, un tag réécrit par un tiers publierait n'importe quoi sous nos images.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR exige un nom en minuscules ; `github.repository_owner` peut contenir des majuscules.
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sankore-${{ matrix.app }}" >> "$GITHUB_OUTPUT"

      # `linux/amd64` : l'architecture de la plupart des VPS. Si le serveur Dokploy est en ARM
      # (Hetzner CAX, Oracle Ampere…), remplacer par `linux/arm64`.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # Déclenche le redéploiement dans Dokploy une fois l'image publiée. Facultatif : sans le
      # secret, l'étape ne fait rien et le déploiement se lance à la main depuis Dokploy.
      - name: Redéployer sur Dokploy
        env:
          WEBHOOK: ${{ matrix.app == 'crm' && secrets.DOKPLOY_WEBHOOK_CRM || secrets.DOKPLOY_WEBHOOK_ADMIN }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "Pas de webhook Dokploy configuré pour ${{ matrix.app }}, redéploiement manuel."
            exit 0
          fi
          curl -fsS -X POST "$WEBHOOK"
