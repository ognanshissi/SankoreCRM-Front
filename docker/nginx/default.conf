# Service statique pour l'application Angular compilée (variante SANS rendu serveur).
#
# Deux pièges valent d'être signalés ici, tous deux rencontrés à la construction :
#
# 1. Le lot produit par @angular/build en `outputMode: "server"` nomme son point d'entrée
#    `index.csr.html` (csr = client-side rendering) et NON `index.html`. Une configuration
#    qui retombe sur `/index.html` renvoie 404 sur toutes les routes de l'application.
#
# 2. nginx traite `{` et `}` comme des délimiteurs de bloc, y compris dans une regex de
#    `location`. Un quantificateur comme `{8,}` doit donc être placé entre guillemets,
#    sans quoi nginx refuse de démarrer sur « unknown directive ».

# Journal du parcours public de dépôt des pièces (KRM-B-05 à B-07, §8 du cahier).
#
# Le format par défaut de nginx ne contient pas le corps de la requête — `$request_body`
# n'y figure pas — mais rien n'empêche un déploiement d'en copier un qui l'ajoute, et sous
# /api/v1/public/kyc ce corps contient un numéro client, une date de naissance et un code
# SMS. Le format est donc DÉFINI ici, sans corps et sans `Referer`, pour que le jour où ce
# nginx relaie l'API la valeur sûre soit celle qui est déjà en place.
#
# Le `Referer` est retiré pour la raison qui a mis le jeton dans le fragment de l'URL : un
# fragment ne part jamais au serveur, mais une page intermédiaire pourrait poser un
# `Referer` portant l'URL complète, et un journal est précisément l'endroit où une chaîne
# de caractères survit des mois.
log_format sankore_public
    '$remote_addr - [$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';

# HSTS seulement quand la requête est bien arrivée en HTTPS — voir le commentaire au point
# d'usage, dans le bloc `server`. `map` est une directive du contexte `http` : placée dans
# un `server`, nginx refuse de démarrer sur « map directive is not allowed here », ce qui
# est la raison pour laquelle elle est ici et non à côté du `add_header` qui la lit.
map $http_x_forwarded_proto $sankore_hsts {
    default "";
    https   "max-age=31536000; includeSubDomains";
}

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.csr.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Routage côté client : toute URL inconnue rend l'application, qui résout la route.
    location / {
        try_files $uri $uri/ /index.csr.html;
    }

    # Fichiers versionnés par empreinte (outputHashing: all) : immuables à URL constante.
    # Guillemets obligatoires à cause du `{8,}` — voir le point 2 ci-dessus.
    location ~* "\.[0-9a-zA-Z]{8,}\.(?:js|css|woff2?|ttf|eot|otf|png|jpe?g|gif|svg|webp|avif|ico)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Le point d'entrée porte les références aux fichiers empreintés : jamais en cache.
    location = /index.csr.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Les cartes de source exposent le code d'origine et pèsent plus que l'application.
    location ~* "\.map$" {
        return 404;
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml image/svg+xml
                      font/woff font/woff2;

    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header Referrer-Policy        "same-origin" always;

    # KRM-F-02/F-04 : la page publique de dépôt des pièces ouvre la caméra du client.
    #
    # `camera=(self)` est la valeur par défaut de la plupart des navigateurs, donc cet
    # en-tête ne débloque rien aujourd'hui — il verrouille. Sans lui, une politique
    # restrictive posée plus haut (reverse proxy, CDN, en-tête ajouté par une plateforme)
    # couperait `getUserMedia` sans qu'aucun message ne dise pourquoi : le composant de
    # capture rapporterait « caméra bloquée par la sécurité du navigateur », ce qui est
    # vrai et inutilisable pour diagnostiquer.
    #
    # `microphone=()` et `geolocation=()` sont refusés explicitement : le parcours n'en a
    # pas besoin, et une page qui demande la caméra à un client n'a aucune raison de
    # pouvoir demander le reste.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # HTTPS sur chaque FQDN (§8). La terminaison TLS est faite en amont (Dokploy), donc ce
    # serveur n'écoute qu'en 80 et ne peut pas l'exiger lui-même — il peut en revanche le
    # faire exiger par le navigateur, et uniquement quand la requête est bien arrivée en
    # HTTPS : posé inconditionnellement, cet en-tête rendrait un déploiement local en HTTP
    # inaccessible pendant six mois sur les postes qui l'auraient vu une fois.
    #
    # Ce n'est pas un détail de confort pour ce parcours : `getUserMedia` est refusé sur une
    # origine non sécurisée, donc un lien ouvert en HTTP produit une page dont la caméra ne
    # démarre jamais et dont l'échec ne dit pas pourquoi. `BuildLink` n'émet que du https
    # côté serveur ; ceci couvre le cas où le client arrive autrement.
    add_header Strict-Transport-Security $sankore_hsts always;

    # Le parcours public, quand ce serveur relaie l'API.
    #
    # `^~` pour que ce préfixe gagne sur les regex de cache ci-dessus, et le `log_format`
    # sans corps ni `Referer` défini en tête de fichier. Aujourd'hui ce bloc ne relaie
    # rien — l'API est servie ailleurs — et sert donc l'application comme le reste ; la
    # ligne `access_log` est là pour être déjà juste le jour où le `proxy_pass` est ajouté
    # juste en dessous. Un déploiement qui ajoute ce relais sans elle écrit les corps dans
    # un journal dès que son format en contient un.
    location ^~ /api/v1/public/kyc {
        access_log /var/log/nginx/access.log sankore_public;

        # proxy_pass http://api:8080;  # à décommenter si l'API passe par ce nginx
        try_files $uri $uri/ /index.csr.html;
    }

    # 12 Mo pour 10 Mo acceptés par l'API (KycDocumentStore). La marge couvre l'enveloppe
    # multipart, qui n'est pas négligeable sur une photo : limite et charge utile ne sont
    # pas la même taille, et un `client_max_body_size` réglé pile sur la limite métier
    # refuse des fichiers que l'API aurait acceptés.
    #
    # Ce serveur ne relaie pas l'API aujourd'hui — il ne sert que l'application compilée —
    # donc la valeur ne bride rien pour l'instant. Elle est corrigée quand même : le jour
    # où un déploiement met l'API derrière le même nginx, 8 Mo refuserait silencieusement
    # les photos de pièce d'identité prises par un téléphone récent, et le symptôme serait
    # un 413 sur la page publique d'un client.
    client_max_body_size 12m;
}
